  - jupyterlab
  - numpy>=1.23,<2
  - matplotlib
  - seaborn
  - pandas
  - pip>=23
  - scikit-learn
  - make
  - haversine
  - git-lfs
  - xgboost
  - paho-mqtt
  - uvicorn
  - fastapi
